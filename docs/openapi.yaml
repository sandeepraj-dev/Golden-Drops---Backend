openapi: 3.0.3
info:
  title: Oil Mill Management API
  version: 1.0.0
  description: REST API for oil mill stock, purchases, sales, payments and reporting.
servers:
  - url: http://localhost:4000/api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object } }
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200': { description: API is healthy }
  /auth/login:
    post:
      security: []
      summary: Authenticate a user
      responses:
        '200': { description: JWT access token }
        '401': { description: Invalid credentials }
  /customers:
    get:
      summary: List/search customers with pagination
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: Customer page }
    post:
      summary: Create customer
      responses:
        '201': { description: Created }
  /suppliers:
    get: { summary: List suppliers, responses: { '200': { description: Supplier page } } }
    post: { summary: Create supplier, responses: { '201': { description: Created } } }
  /oil-types:
    get: { summary: List oil types, responses: { '200': { description: Oil types } } }
    post: { summary: Create oil type, responses: { '201': { description: Created } } }
  /oil-prices:
    get: { summary: List price history, responses: { '200': { description: Price history } } }
    post: { summary: Create a price period, responses: { '201': { description: Created } } }
  /purchases:
    get: { summary: List purchases, responses: { '200': { description: Purchases } } }
    post: { summary: Create purchase and stock-in movements, responses: { '201': { description: Purchase created } } }
  /sales:
    get: { summary: List sales, responses: { '200': { description: Sales } } }
    post: { summary: Create sale and stock-out movements, responses: { '201': { description: Sale created } } }
  /payments:
    get: { summary: List payments, responses: { '200': { description: Payments } } }
    post: { summary: Record payment with invoice allocations, responses: { '201': { description: Payment created } } }
  /stock:
    get: { summary: Current stock by oil type/location, responses: { '200': { description: Stock rows } } }
  /stock/ledger:
    get: { summary: Search stock movements, responses: { '200': { description: Stock ledger page } } }
  /daily-stock:
    get: { summary: List daily stock reports, responses: { '200': { description: Daily reports } } }
  /reports/profit-loss:
    get:
      summary: Profit and loss report
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: P&L report }
  /dashboard:
    get: { summary: Dashboard summary, responses: { '200': { description: Summary metrics } }
